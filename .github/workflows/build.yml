name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  PACKAGE_DIR: fastgraphml
  TESTS_DIR: tests
  # PyTorch version the PyG extension wheels (https://data.pyg.org/whl) are installed for
  TORCH: "2.12.0"
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: |
          pip install torch==${{ env.TORCH }} --index-url https://download.pytorch.org/whl/cpu
          pip install .[dev]
      - name: Run black
        run: black --check --verbose --diff --color ${{ env.PACKAGE_DIR }} ${{ env.TESTS_DIR }}
      - name: Run flake8
        run: flake8 ${{ env.PACKAGE_DIR }} ${{ env.TESTS_DIR }}
      - name: Run isort
        run: isort --check --profile=black ${{ env.PACKAGE_DIR }} ${{ env.TESTS_DIR }}
      - name: Run mypy
        run: mypy ${{ env.PACKAGE_DIR }} ${{ env.TESTS_DIR }}
      - name: Run bandit
        run: bandit --recursive ${{ env.PACKAGE_DIR }}
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    name: Test - Python ${{ matrix.python }}
    services:
      arangodb:
        image: arangodb/arangodb:3.12
        env:
          ARANGO_ROOT_PASSWORD: fastgraphml
        ports:
          - 8529:8529
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install packages
        run: |
          pip install torch==${{ env.TORCH }} --index-url https://download.pytorch.org/whl/cpu
          pip install pyg-lib torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-${{ env.TORCH }}+cpu.html
          pip install .[dev,arango]
      - name: Run pytest
        env:
          MPLBACKEND: Agg
        run: pytest --password fastgraphml --cov=${{ env.PACKAGE_DIR }} --cov-report xml --cov-report term-missing -v --color=yes --no-cov-on-fail --code-highlight=yes
