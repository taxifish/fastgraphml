[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fastgraphml"
version = "0.1.0"
description = "Given an input graph the library generates graph embeddings using Low-Code built on top of PyG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }
authors = [{ name = "Sachin Sharma", email = "sachin@arangodb.com" }]
keywords = [
    "arangodb",
    "pyg",
    "graph deep learning",
    "graph embeddings",
    "pytorch geometric",
    "graph machine learning",
    "graph neural networks",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# PyTorch is listed without an upper bound on purpose: install the build that
# matches your CUDA version first (see README), pip will then leave it alone.
dependencies = [
    "torch>=2.2",
    "torch-geometric>=2.5",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "rich>=12.5.1",
    "python-arango>=7.6",
]

[project.optional-dependencies]
# ArangoDB <-> PyG conversion and the example datasets.
# adbpyg-adapter needs torch-sparse and torch-scatter, see README.
arango = ["adbpyg-adapter>=1.1.4", "arango-datasets>=1.2.0"]
# similarity search (use faiss-gpu builds from conda if you need GPU search)
search = ["faiss-cpu>=1.7.4"]
# UMAP visualisation of embeddings
viz = ["umap-learn>=0.5.5", "matplotlib>=3.7", "seaborn>=0.12"]
all = ["fastgraphml[arango,search,viz]"]
dev = [
    "fastgraphml[search,viz]",
    "black>=24.0",
    "flake8>=7.0",
    "isort>=5.13",
    "mypy>=1.8",
    "bandit>=1.7.7",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pre-commit>=3.6",
]

[project.urls]
Homepage = "https://github.com/taxifish/fastgraphml"
Upstream = "https://github.com/arangoml/fastgraphml"

[tool.setuptools.packages.find]
include = ["fastgraphml*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.coverage.report]
omit = ["*tests*"]

[tool.coverage.run]
omit = ["*tests*"]
